{% extends 'base.html' %}

{% block title %}Create Workflow - SimpleFlow{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-4xl font-bold mb-8">Create New Workflow</h1>
    
    <div class="bg-gray-800 p-8 rounded-lg border border-gray-700">
        <form method="POST" class="space-y-6">
            {% csrf_token %}
            
            <div>
                <label for="title" class="block text-sm font-medium text-gray-300 mb-2">
                    Workflow Title *
                </label>
                <input type="text" name="title" id="title" required
                    class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="e.g., Daily Report Generator">
            </div>
            
            <div>
                <label for="description" class="block text-sm font-medium text-gray-300 mb-2">
                    Description
                </label>
                <textarea name="description" id="description" rows="4"
                    class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Describe what this workflow does..."></textarea>
            </div>
            
            <div class="flex space-x-4">
                <button type="submit" class="flex-1 py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg">
                    Create Workflow
                </button>
                <a href="{% url 'dashboard' %}" class="flex-1 py-3 bg-gray-700 hover:bg-gray-600 text-white font-medium rounded-lg text-center">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
