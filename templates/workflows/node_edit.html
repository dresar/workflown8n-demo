{% extends 'base.html' %}

{% block title %}Edit Node - {{ node.name }}{% endblock %}

{% block content %}
<div class="mb-6">
    <a href="{% url 'workflow_edit' node.workflow.id %}" class="text-blue-400 hover:text-blue-300">← Back to Workflow</a>
</div>

<div class="max-w-2xl mx-auto">
    <h1 class="text-4xl font-bold mb-8">Edit Node: {{ node.name }}</h1>
    
    <div class="bg-gray-800 p-8 rounded-lg border border-gray-700">
        <form method="POST" class="space-y-6">
            {% csrf_token %}
            
            <div>
                <label for="name" class="block text-sm font-medium text-gray-300 mb-2">
                    Node Name
                </label>
                <input type="text" name="name" id="name" value="{{ node.name }}" required
                    class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div>
                <label for="node_type" class="block text-sm font-medium text-gray-300 mb-2">
                    Node Type
                </label>
                <select name="node_type" id="node_type" required
                    class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    {% for value, label in node_types %}
                    <option value="{{ value }}" {% if value == node.node_type %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div>
                <label for="config" class="block text-sm font-medium text-gray-300 mb-2">
                    Configuration (JSON)
                </label>
                <textarea name="config" id="config" rows="12"
                    class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white font-mono text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">{{ config_json }}</textarea>
                <p class="text-xs text-gray-400 mt-1">
                    Use {{input}} to reference the output from the previous node.
                </p>
            </div>
            
            <div class="flex space-x-4">
                <button type="submit" class="flex-1 py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg">
                    Update Node
                </button>
                <a href="{% url 'workflow_edit' node.workflow.id %}" class="flex-1 py-3 bg-gray-700 hover:bg-gray-600 text-white font-medium rounded-lg text-center">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
