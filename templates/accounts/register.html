{% extends 'base.html' %}

{% block title %}Register - SimpleFlow{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-gray-800 p-8 rounded-lg border border-gray-700">
        <h2 class="text-3xl font-bold text-center mb-6">Register</h2>
        
        <form method="POST" class="space-y-6">
            {% csrf_token %}
            
            <div>
                <label for="username" class="block text-sm font-medium text-gray-300 mb-2">
                    Username
                </label>
                <input type="text" name="username" id="username" required
                    class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div>
                <label for="email" class="block text-sm font-medium text-gray-300 mb-2">
                    Email
                </label>
                <input type="email" name="email" id="email" required
                    class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div>
                <label for="password" class="block text-sm font-medium text-gray-300 mb-2">
                    Password
                </label>
                <input type="password" name="password" id="password" required
                    class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div>
                <label for="password_confirm" class="block text-sm font-medium text-gray-300 mb-2">
                    Confirm Password
                </label>
                <input type="password" name="password_confirm" id="password_confirm" required
                    class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            
            <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg">
                Register
            </button>
        </form>
        
        <p class="text-center mt-6 text-gray-400">
            Already have an account? 
            <a href="{% url 'login' %}" class="text-blue-400 hover:text-blue-300">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
